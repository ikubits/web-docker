# version: '3.8'

services:
  # Apache and PHP service
  web:
    build:
      # Choose a php version (prepare new one if needed)
      # context: ./php/8.2
      context: ./php/8.4
      # ---
      args:
        # Pull dynamically from host environment variables (exported by web-docker.sh)
        UID: ${WEB_DOCKER_UID:-1000} # user id
        GID: ${WEB_DOCKER_GID:-1000} # group id
    container_name: php-apache-container
    ports:
      - "80:80"
    volumes:
      # Choose a projects location local or symlink
      - ./www/html:/var/www/html # ./www/html is a static folder inside
      # - ./www/projects:/var/www/html # ./www/projects is a symlink from another location
      # ---
      # - ./php/8.2/php.ini:/usr/local/etc/php/php.ini
      - ./apache/vhosts:/etc/apache2/sites-enabled
      - ./apache/logs:/var/log/apache2
      # - ./apache/logs/php/error.log:/var/log/php_errors.log
    depends_on:
      - db
    networks:
      - devnet

  db:
    image: mariadb:11.7
    container_name: mariadb-container
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      # MYSQL_USER: user
      # MYSQL_PASSWORD: pass
      # MYSQL_DATABASE: mydb
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - devnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: pma-container
    # restart: always
    ports:
      - 8080:80
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 256M
    depends_on:
      - db
    networks:
      - devnet

volumes:
  dbdata:

networks:
  devnet:
    name: global-devnet
    driver: bridge
